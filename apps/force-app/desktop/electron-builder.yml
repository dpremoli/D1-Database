# Electron packaging config. Unsigned (v1 — see ADR-0010's open decisions) and the update feed is
# Tailscale-only; both are documented, coupled decisions — do not point `publish.url` at a public
# host without re-reading docs/superpowers/specs/2026-08-10-force-app-desktop-packaging-design.md.
appId: net.tailscale.d1-server.force-app
productName: Force App
# npm workspaces hoists `electron` to the repo root node_modules; electron-builder only looks
# inside this workspace's own node_modules and can't fall back to a caret-range version string,
# so it must be told explicitly. Keep this in sync with the installed electron version
# (electron-builder logs the version it expects if this drifts).
electronVersion: 44.5.1
directories:
  output: release
files:
  - dist/**/*
  - static/**/*
  - package.json
extraResources:
  # dist-desktop, not dist: the desktop build variant has base '/' so assets resolve under
  # app://force/. The plain `dist` build has base '/app/' and is exclusively Caddy's browser surface.
  - from: ../web/dist-desktop
    to: web
  - from: ../backend/dist/force-app-backend
    to: backend
win:
  target: nsis
  # electron-builder would pick up build/icon.ico from the default buildResources dir either way;
  # explicit since every other icon-adjacent choice here is spelled out too. Multi-resolution ICO
  # (16 up to 256px) — embeds into the .exe itself, so title bar, taskbar, and Start Menu all get
  # it for free with no runtime code.
  icon: build/icon.ico
  # No space here (unlike productName) — GitHub silently rewrites spaces to periods in uploaded
  # release-asset filenames, but electron-builder generates latest.yml from this name BEFORE that
  # upload-time rename happens. The feed ends up pointing at a filename that never actually exists
  # on GitHub, and electron-updater 404s trying to fetch it. A space-free artifact name sidesteps
  # the mismatch entirely rather than needing publish-release.ps1 to correct latest.yml after the
  # fact.
  artifactName: 'ForceApp-Setup-${version}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  - provider: generic
    url: https://d1-server.tail54eeb6.ts.net/force-app-updates/
    channel: latest
