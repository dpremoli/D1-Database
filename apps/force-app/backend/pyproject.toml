[project]
name = "force-app-backend"
version = "0.1.0"
description = "Standalone force app — local recording/acquisition backend (Phase 2, slice 2a: sim + live streaming)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "scipy>=1.11",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Real NI-DAQ acquisition (slice 2b). Needs the NI-DAQmx runtime installed on the host; only
# required on the acquisition PC. Install with:  pip install -e ".[nidaq]"
nidaq = ["nidaqmx>=1.0"]

# This sub-app inherits the repo-wide ruff rule set but uses a wider line length — the
# backend was written at ~100 cols. Scoped here so the root stays at 88 for everything else.
[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
