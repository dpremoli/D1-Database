# D1-Database — full stack definition.
#
# Phase 2: healthchecks, restart policies, reverse proxy (Caddy),
# and MinIO bucket bootstrap added. Config from `.env` (copy from `.env.example`);
# `${VAR:-default}` fallbacks keep this valid without a .env present.
name: d1-database

services:
  # The durable core (ADR-0001). pgvector image = Postgres + pgvector extension.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-d1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-d1_database}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [d1net]

  # Job queue for the heavy-data pipeline (Phase 4).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist every 60 s if at least 1 key changed; quiet logs.
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [d1net]

  # S3-compatible object storage for 10-100 GB files (bypasses the API layer).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_too}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [d1net]

  # Swappable adapter (ADR-0002): UI / REST / GraphQL / RBAC over OUR schema.
  # Introspects but does NOT alter structure — schema is owned by our migrations.
  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY:-replace-with-random-key}
      SECRET: ${DIRECTUS_SECRET:-replace-with-random-secret}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-d1_database}
      DB_USER: ${POSTGRES_USER:-d1}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change_me_admin}
      # Public URL used for link generation; override in .env for production.
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:80}
      # Auto-load local extensions (the actor-identity audit hook).
      EXTENSIONS_AUTO_RELOAD: "true"
      # NOTE: we deliberately do NOT declare a `star` storage location. The
      # archive files (directus_files.storage='star') are browse/link only — users
      # open them via UNC/Explorer (d1-archive-links), never downloaded through
      # Directus. Declaring `star` as a local driver makes Directus try to mkdir /
      # write-probe its root, which fails for a read-only, mount-less location and
      # turns the container unhealthy. Listing/linking works fine without it.
      STORAGE_LOCATIONS: local
      # Path B (Ask-the-Database): the d1-ask-endpoint extension proxies chat
      # requests to the guarded text-to-SQL plugin over the internal d1net.
      LLM_PLUGIN_URL: ${LLM_PLUGIN_URL:-http://llm-text-to-sql:8080}
      WORKER_WEBHOOK_SECRET: ${WORKER_WEBHOOK_SECRET:-}
    # Path A (built-in AI Chat) and any server-side extension that calls the host
    # can reach the host's Ollama here. Auto-resolved on Windows/Mac Docker
    # Desktop; the host-gateway mapping makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    volumes:
      - directus-uploads:/directus/uploads
      # Mount the version-controlled hook extensions (read-only).
      - ./core/extensions:/directus/extensions:ro
      # Read-only SMB archive (see the `archive_share` volume below).
      # TEMPORARILY DETACHED: SMB credential expired (required key not available).
      # Restore this line and refresh SMB_PASS in .env once the share re-auths.
      # - archive_share:/mnt/archive:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:8055/server/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Directus runs its own migrations on first boot — give it time.
      start_period: 60s
    networks: [d1net]

  # Heavy-data pipeline worker (Phase 4).
  # Exposes a webhook endpoint (Directus Flow target) and an rq worker that
  # parses large .d1f files from MinIO under a fixed memory ceiling.
  heavy-data-worker:
    build:
      context: plugins/heavy-data-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_too}
      MINIO_BUCKET: ${MINIO_BUCKET:-d1-files}
      DIRECTUS_URL: http://directus:8055
      WORKER_DIRECTUS_TOKEN: ${WORKER_DIRECTUS_TOKEN:-}
      WORKER_MEMORY_LIMIT_MB: ${WORKER_MEMORY_LIMIT_MB:-256}
      WORKER_WEBHOOK_SECRET: ${WORKER_WEBHOOK_SECRET:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-214748364800}
      WORKER_HTTP_PORT: "8080"
    ports:
      - "${WORKER_HTTP_PORT:-8080}:8080"
    volumes:
      # Read-only SMB archive — lets the worker fetch linked files by path.
      - archive_share:/mnt/archive:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [d1net]

  # FFT / frequency-analysis plugin (Phase 5).
  # Triggered by a Directus Flow when a test_session file is ready for analysis.
  # Computes amplitude spectrum, dominant frequencies, and band energy per channel.
  analysis-worker:
    build:
      context: plugins/analysis-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_too}
      MINIO_BUCKET: ${MINIO_BUCKET:-d1-files}
      DIRECTUS_URL: http://directus:8055
      WORKER_DIRECTUS_TOKEN: ${WORKER_DIRECTUS_TOKEN:-}
      WORKER_WEBHOOK_SECRET: ${WORKER_WEBHOOK_SECRET:-}
      WORKER_HTTP_PORT: "8081"
      QUEUE_NAME: analysis
      FFT_CHANNEL_INDEX: "2"
    ports:
      - "${ANALYSIS_HTTP_PORT:-8081}:8081"
    volumes:
      # Read-only SMB archive — lets the worker fetch linked files by path.
      - archive_share:/mnt/archive:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [d1net]

  # Local LLM runtime for text-to-SQL and embeddings (Phase 6, spec §6).
  # Opt-in: in the "llm" profile so the heavy image/models are not pulled by
  # default. Start with:  docker compose --profile llm up -d
  # Pull models once after first start (see docs/runbooks/text-to-sql.md):
  #   docker compose exec ollama ollama pull llama3
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["llm"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [d1net]

  # Text-to-SQL API (Phase 6). Natural language in, guarded read-only SQL and
  # rows out. The LLM's SQL is validated by app.lib.sql_guard and executed only
  # through the d1_llm_readonly role (see ADR-0009). Also serves /api/search
  # (pgvector hybrid search) and /api/embed/backfill.
  llm-text-to-sql:
    build:
      context: plugins/llm-text-to-sql
      dockerfile: Dockerfile
    restart: unless-stopped
    # Always-on (not in the "llm" profile) so the Directus d1-ask-endpoint
    # extension can reach it on d1net for the Ask-the-Database chat page. It is
    # light (Flask/gunicorn) and only calls the LLM on demand.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Read-only role DSN for executing LLM-authored SQL (defence-in-depth).
      LLM_DATABASE_URL: ${LLM_DATABASE_URL:-}
      # Writer DSN for the embedding backfill (writes semantic_embeddings).
      EMBED_DATABASE_URL: ${EMBED_DATABASE_URL:-}
      # Point at the host's Ollama (the one the maintainer already runs) rather
      # than the containerised `ollama` service. Swap back to http://ollama:11434
      # if you prefer the in-profile container (docker compose --profile llm up).
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_SQL_MODEL: ${OLLAMA_SQL_MODEL:-llama3}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      LLM_STATEMENT_TIMEOUT_MS: ${LLM_STATEMENT_TIMEOUT_MS:-5000}
      WORKER_WEBHOOK_SECRET: ${WORKER_WEBHOOK_SECRET:-}
      WORKER_HTTP_PORT: "8080"
    # Reach the host Ollama (see OLLAMA_URL above) from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LLM_HTTP_PORT:-8082}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [d1net]

  # FRM filter-service: interactive signal-filter previews for the force dashboard
  # (docs/superpowers/specs/2026-07-21-frm-filtering-suite-design.md). Fetches live
  # caches from Directus forwarding the CALLER'S credentials (no service account),
  # filters with scipy, returns decimated previews. Served same-origin via Caddy
  # at /filter/* — no published ports.
  filter-service:
    build:
      context: plugins/filter-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    environment:
      DIRECTUS_URL: http://directus:8055
      CACHE_LRU: "4"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [d1net]

  # Reverse proxy: single HTTP entry point → Directus admin UI.
  # MinIO console and API remain directly accessible on their own ports.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/octrees:/srv/octrees:ro          # Potree octrees, served same-origin (Phase 2)
      - caddy-data:/data
      - caddy-config:/config
    networks: [d1net]

volumes:
  pgdata:
  redis-data:
  minio-data:
  directus-uploads:
  caddy-data:
  caddy-config:
  ollama-models:

  # Read-only mount of the university SMB archive (Z: → \\uosfstore.shef.ac.uk\shared).
  # The whole `shared` export is mounted; only the star_group1 subtree is used
  # (STORAGE_STAR_ROOT and the indexer point at /mnt/archive/star_group1).
  # Credentials live in .env (SMB_USER / SMB_PASS). The mount is read-only twice
  # over: `ro` in the options AND `:ro` on every service mount.
  # If SMB negotiation fails, adjust `vers=` (try 3.1.1 or 2.1) or add `domain=`.
  archive_share:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SMB_HOST:-uosfstore.shef.ac.uk}/${SMB_SHARE:-shared}"
      o: "username=${SMB_USER:-},password=${SMB_PASS:-},domain=${SMB_DOMAIN:-},ro,uid=1000,gid=1000,vers=3.0,file_mode=0444,dir_mode=0555,iocharset=utf8"

networks:
  d1net:
    driver: bridge
