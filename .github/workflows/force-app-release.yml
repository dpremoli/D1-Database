name: force-app-release

on:
  push:
    tags:
      - 'force-app-v*'
    # No `paths:` filter here — GitHub cannot compute a path diff for a newly pushed tag ref, and
    # the combination can silently stop the workflow from firing at all. The tag glob is already a
    # narrow enough trigger on its own.

# Needed by the "Create GitHub Release" step; the default GITHUB_TOKEN is read-only for contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Fail fast: a tag that outruns the manifest makes electron-builder emit a latest.yml
      # advertising the stale version, so electron-updater on deployed rigs never sees the release.
      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^force-app-v', ''
          $pkgVersion = (Get-Content apps/force-app/desktop/package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "Tag $env:GITHUB_REF_NAME (version $tagVersion) does not match apps/force-app/desktop/package.json version $pkgVersion"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/force-app/backend/pyproject.toml

      # electron-builder's own downloads (the electron binary, nsis, winCodeSign) are not npm
      # packages, so setup-node's cache above never touches them — same ~100s of re-downloading
      # every run otherwise. Keyed on package-lock.json since that pins the electron/electron-builder
      # versions that determine what gets fetched.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # By far the single largest step otherwise (~3.5 min to fetch Chromium fresh every run).
      # Keyed on package-lock.json so a @playwright/test version bump invalidates it automatically.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install JS workspace dependencies
        run: npm ci

      # The desktop variant (base '/', outDir dist-desktop) — CI packages the Electron app and has
      # no use for the '/app/' browser build Caddy serves.
      - name: Build the web SPA
        run: npm run build:web:desktop

      - name: Install backend dependencies
        working-directory: apps/force-app/backend
        run: |
          python -m venv .venv
          # The nidaq extra is the pure-Python nidaqmx wrapper — installing and freezing it needs
          # no NI-DAQmx driver or hardware on the runner, but omitting it ships installers that
          # can never talk to a DAQ.
          .venv\Scripts\pip install -e ".[dev,build,nidaq]"

      - name: Run backend tests
        working-directory: apps/force-app/backend
        run: .venv\Scripts\pytest

      # The backup server is a separate deployable (it runs on d1-server, not the acquisition PC),
      # so it sits outside the backend's own testpaths and was never collected by the step above —
      # its suite, including the offset dedup guarantees the whole live-backup design rests on, had
      # never run in CI. It imports `server` by name, so it must run from its own directory.
      - name: Run backup-server tests
        working-directory: apps/force-app/backup-server
        run: ..\backend\.venv\Scripts\pytest

      - name: Freeze the backend with PyInstaller
        working-directory: apps/force-app/backend
        run: .venv\Scripts\pyinstaller force-app-backend.spec --noconfirm

      - name: Run desktop unit tests
        working-directory: apps/force-app/desktop
        run: npm test

      - name: Build the Electron installer
        working-directory: apps/force-app/desktop
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Install Playwright browsers
        working-directory: apps/force-app/desktop
        run: npx playwright install chromium --with-deps

      - name: Run desktop smoke tests
        working-directory: apps/force-app/desktop
        run: npm run test:e2e

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: force-app-installer
          path: |
            apps/force-app/desktop/release/*.exe
            apps/force-app/desktop/release/latest.yml

      # scripts/publish-release.ps1 pulls with `gh release download <tag>`, which reads Release
      # assets — a workflow-run artifact is not the same thing and is invisible to it. Creating a
      # Release here is a plain GitHub API call; it does not push to the tailnet feed. Populating
      # that feed stays a manual publish-release.ps1 run on d1-server.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" apps/force-app/desktop/release/*.exe apps/force-app/desktop/release/latest.yml --title "$env:GITHUB_REF_NAME" --notes "Automated build from CI."
