name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repo, issues or PRs.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  geometry:
    name: Sample geometry engine (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vendored copies in sync
        run: bash scripts/sync_geometry.sh --check
      - name: Unit tests
        run: node --experimental-strip-types --test core/extensions/d1-geometry-preview/test/geometry.test.ts

  foundation:
    name: Foundation smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository foundation
        run: bash tests/phase0_smoke.sh
      # docker compose is preinstalled on ubuntu-latest runners, so the
      # compose-validation step inside the smoke test runs here too.

  migrations:
    name: Schema migrations (up + down + seed + schema tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: d1
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: d1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://d1:ci_secret@localhost:5432/d1_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      # Pinned by sha256. dbmate does not publish a checksum file, so this digest was computed
      # from the official v2.23.0 release asset (fetched twice, identical). When bumping the
      # version, download the new asset, verify it against the release page, and update both.
      - name: Install dbmate
        env:
          DBMATE_SHA256: 757e0ede33fad35010ce5fdba201a4f2181516471676fe5eab6f93ff70ec7424
        run: |
          curl -fsSL -o /tmp/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.23.0/dbmate-linux-amd64
          echo "${DBMATE_SHA256}  /tmp/dbmate" | sha256sum --check --strict -
          sudo install -m 0755 /tmp/dbmate /usr/local/bin/dbmate

      - name: Apply all migrations (up)
        run: dbmate --no-dump-schema up

      - name: Load seed data
        run: psql "$DATABASE_URL" -f db/seeds/001_reference_data.sql

      - name: Run Phase 1 schema tests
        run: bash tests/phase1_schema.sh

      - name: Run Phase 7 traceability tests
        run: bash tests/phase7_traceability.sh

      - name: Run Phase 6 AI-readiness tests
        run: bash tests/phase6_text_to_sql.sh

      - name: Purge test/seed data before rollback
        run: |
          psql "$DATABASE_URL" -c "
            DO \$\$
            DECLARE r RECORD;
            BEGIN
              FOR r IN SELECT tablename FROM pg_tables
                       WHERE schemaname = 'public'
                         -- audit_logs is append-only (a BEFORE TRUNCATE trigger raises);
                         -- the rollback drops it like any other table.
                         AND tablename NOT IN ('schema_migrations', 'audit_logs')
              LOOP
                EXECUTE format('TRUNCATE TABLE %I CASCADE', r.tablename);
              END LOOP;
            END \$\$;"

      - name: Roll back all migrations (down — verifies reversibility)
        run: |
          for _ in $(seq 1 200); do
            dbmate --no-dump-schema down || break
          done

      - name: Verify clean rollback (no tables remain)
        run: |
          tables=$(psql "$DATABASE_URL" -t -A -c \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
               AND table_name != 'schema_migrations'")
          echo "Tables after full rollback: $tables"
          [[ "$tables" -eq 0 ]] || (echo "FAIL: $tables tables remain after rollback" && exit 1)

  worker-build:
    name: Heavy-data worker (docker build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -t d1-heavy-data-worker plugins/heavy-data-worker/
      - name: Run unit tests
        run: |
          docker run --rm d1-heavy-data-worker \
            python -m pytest tests/ -v --tb=short

  analysis-build:
    name: Analysis worker (docker build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build analysis image
        run: docker build -t d1-analysis-worker plugins/analysis-worker/
      - name: Run unit tests
        run: |
          docker run --rm d1-analysis-worker \
            python -m pytest tests/ -v --tb=short

  llm-build:
    name: Text-to-SQL plugin (docker build + guard tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build text-to-SQL image
        run: docker build -t d1-llm-text-to-sql plugins/llm-text-to-sql/
      - name: Run unit tests (SQL guard, schema context, eval golds)
        run: |
          docker run --rm d1-llm-text-to-sql \
            python -m pytest tests/ -v --tb=short

  # ---- Force app ------------------------------------------------------------------------------
  # Until these jobs existed nothing force-related ran on a PR: force-app-release.yml runs only the
  # backend, backup-server and desktop suites, and only when a release is tagged. The Windows-only
  # parts (PyInstaller freeze, NSIS build, Playwright against the packaged app, taskkill) stay there.

  force-app-js:
    name: Force app JS (plotting, web, desktop, Directus dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: "@d1/force-plotting: unit tests + typecheck"
        run: |
          npm test -w @d1/force-plotting
          npm run typecheck -w @d1/force-plotting
      - name: "force-app-web: unit tests + typecheck + theme lint"
        run: |
          npm test -w force-app-web
          npm run typecheck -w force-app-web
          npm run lint:theme -w force-app-web
      - name: "force-app-desktop: unit tests + typecheck"
        run: |
          npm test -w force-app-desktop
          npm run typecheck -w force-app-desktop
      - name: Build the web app (desktop base) and the Directus force dashboard
        run: |
          npm run build:web:desktop
          npm run build:extension

  force-app-python:
    name: Force app Python (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: recorder backend
            dir: apps/force-app/backend
            install: -e .[dev]
            deps: apps/force-app/backend/pyproject.toml
          - name: backup-server
            dir: apps/force-app/backup-server
            install: -r requirements.txt
            deps: apps/force-app/backup-server/requirements.txt
          - name: bug-report-relay
            dir: apps/force-app/bug-report-relay
            install: -r requirements.txt
            deps: apps/force-app/bug-report-relay/requirements.txt
          - name: filter-service
            dir: plugins/filter-service
            install: -r requirements.txt
            deps: plugins/filter-service/requirements.txt
          - name: diag-service
            dir: plugins/diag-service
            install: -r requirements.txt
            deps: plugins/diag-service/requirements.txt
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.deps }}
      - name: Install dependencies
        run: pip install ${{ matrix.install }}
      - name: Run tests
        run: python -m pytest
